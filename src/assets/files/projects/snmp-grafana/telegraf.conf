[agent]
  interval = "10s"

[[inputs.snmp]]
  agents = ["udp://127.0.0.1:161"]
  version = 2
  community = "public"

  [[inputs.snmp.field]]
    name = "hostname"
    oid = "SNMPv2-MIB::sysName.0"

  [[inputs.snmp.field]]
    name = "uptime"
    oid = "SNMPv2-MIB::sysUpTime.0"

  [[inputs.snmp.table]]
    name = "interface"

    [[inputs.snmp.table.field]]
      name = "interface"
      oid = "IF-MIB::ifDescr"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "status"
      oid = "IF-MIB::ifOperStatus"

    [[inputs.snmp.table.field]]
      name = "speed_mbps"
      oid = "IF-MIB::ifHighSpeed"

    [[inputs.snmp.table.field]]
      name = "in_octets"
      oid = "IF-MIB::ifHCInOctets"

    [[inputs.snmp.table.field]]
      name = "out_octets"
      oid = "IF-MIB::ifHCOutOctets"

    [[inputs.snmp.table.field]]
      name = "in_errors"
      oid = "IF-MIB::ifInErrors"

    [[inputs.snmp.table.field]]
      name = "out_errors"
      oid = "IF-MIB::ifOutErrors"

    [[inputs.snmp.table.field]]
      name = "in_discards"
      oid = "IF-MIB::ifInDiscards"

    [[inputs.snmp.table.field]]
      name = "out_discards"
      oid = "IF-MIB::ifOutDiscards"

  [[inputs.snmp.table]]
    name = "cpu"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "load_percent"
      oid = "HOST-RESOURCES-MIB::hrProcessorLoad"

  [[inputs.snmp.table]]
    name = "storage"

    [[inputs.snmp.table.field]]
      name = "storage"
      oid = "HOST-RESOURCES-MIB::hrStorageDescr"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "allocation_units"
      oid = "HOST-RESOURCES-MIB::hrStorageAllocationUnits"

    [[inputs.snmp.table.field]]
      name = "size"
      oid = "HOST-RESOURCES-MIB::hrStorageSize"

    [[inputs.snmp.table.field]]
      name = "used"
      oid = "HOST-RESOURCES-MIB::hrStorageUsed"

[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
